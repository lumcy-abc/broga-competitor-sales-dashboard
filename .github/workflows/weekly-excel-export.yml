name: Weekly Competitor Excel Export

on:
  schedule:
    # 09:00 Malaysia time every Monday (01:00 UTC), after the daily collection job.
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install workbook dependency
        run: npm install --no-save exceljs

      - name: Generate horizontal workbook from history
        run: node scripts/export_competitor_workbook.mjs

      - name: Save workbook as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Broga-Competitor-Sales-Analysis
          path: Broga_Competitor_Sales_Analysis.xlsx
          if-no-files-found: error
          retention-days: 30
          
      - name: Publish Excel workbook for dashboard download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Broga_Competitor_Sales_Analysis.xlsx
          if git diff --cached --quiet; then
            echo "Workbook is unchanged."
          else
            git commit -m "Update downloadable competitor analysis workbook"
            git push
          fi
