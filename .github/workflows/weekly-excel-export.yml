name: Daily and Weekly Competitor Excel Refresh

on:
  schedule:
    # 09:00 Malaysia time every day (01:00 UTC), after daily TEDUH collection.
    # This refreshes the weekly workbook (weekly summaries and current-month tabs).
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: broga-competitor-workbook-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook dependencies
        run: |
          npm install --no-save exceljs
          python -m pip install --upgrade pip
          python -m pip install openpyxl

      - name: Generate base competitor workbook from history
        run: node scripts/export_competitor_workbook.mjs

      - name: Generate weekly tracking workbook (the daily workbook is built as part of the same script but is not published)
        run: python scripts/export_daily_weekly_reports.py

      - name: Save weekly workbook as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Broga-Weekly-Tracking
          path: |
            Broga_Competitor_Sales_Analysis.xlsx
            Broga_Daily_Tracking.xlsx
            Broga_Weekly_Tracking.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest weekly workbook to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Broga_Weekly_Tracking.xlsx
          if git diff --cached --quiet; then
            echo "Weekly workbook is unchanged."
          else
            git commit -m "Update weekly competitor tracking workbook"
            git push
          fi

      # Copies the weekly workbook to the SharePoint library so nobody has to download it by hand.
      # Skipped (with a notice) until the five secrets exist. A failure here does not stop the run above.
      - name: Upload weekly workbook to SharePoint library
        continue-on-error: true
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_DRIVE_ID: ${{ secrets.ONEDRIVE_DRIVE_ID }}
          ONEDRIVE_FOLDER_PATH: ${{ secrets.ONEDRIVE_FOLDER_PATH }}
        run: |
          if [ -z "$MS_TENANT_ID" ]; then
            echo "::notice::SharePoint secrets are not set; skipping the upload."
            exit 0
          fi
          node scripts/upload_to_onedrive.mjs
