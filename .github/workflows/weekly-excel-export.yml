name: Daily and Weekly Competitor Excel Refresh

on:
  schedule:
    # 09:00 Malaysia time every day (01:00 UTC), after daily TEDUH collection.
    # This refreshes the daily workbook, weekly summaries, and current-month tabs.
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: broga-competitor-workbook-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook dependencies
        run: |
          npm install --no-save exceljs
          python -m pip install --upgrade pip
          python -m pip install openpyxl

      - name: Generate base competitor workbook from history
        run: node scripts/export_competitor_workbook.mjs

      - name: Generate monthly daily and weekly tracking workbooks
        run: python scripts/export_daily_weekly_reports.py

      - name: Save workbooks as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Broga-Competitor-Tracking-Reports
          path: |
            Broga_Competitor_Sales_Analysis.xlsx
            Broga_Daily_Tracking.xlsx
            Broga_Weekly_Tracking.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest Excel workbooks to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Broga_Competitor_Sales_Analysis.xlsx Broga_Daily_Tracking.xlsx Broga_Weekly_Tracking.xlsx
          if git diff --cached --quiet; then
            echo "Workbooks are unchanged."
          else
            git commit -m "Update daily and weekly competitor tracking workbooks"
            git push
          fi
